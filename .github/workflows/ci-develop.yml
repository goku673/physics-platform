name: CI-develop

on:
  push:
    branches: ['main', 'develop', 'ft/*']
  pull_request:
    branches: ['main', 'dev']

jobs: 
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar codigo
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/actions-setup@v4
        with: # Corregido: era 'whith'
          version: 10
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with: # Corregido: era 'whith'
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisamos calidad lint
        run: pnpm lint

      # --- PASO CRUCIAL PARA NEXT.JS ---
      - name: Verificar Build
        run: pnpm build
        env:
          # Necesitas pasar estas variables para que el build no falle
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}